<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>はまじ クーポン</title><style>
:root{font:15px/1.7 system-ui,-apple-system,sans-serif;color:#203c42;background:#f3f5f2}*{box-sizing:border-box}body{margin:0}main{max-width:470px;margin:auto;padding:22px 20px 38px}header{text-align:center;padding:8px 0 20px}header p{font-size:12px;letter-spacing:.12em;margin:0}h1{font-size:24px;font-weight:600;letter-spacing:.08em;margin:4px 0}h2{font-size:24px;line-height:1.6;margin:16px 0}.notice{background:#fff3d8;border:1px solid #ddca9e;padding:11px 14px;border-radius:9px;font-size:13px}label{display:block;font-size:13px;margin:20px 0 6px}select{width:100%;font:inherit;padding:11px;border:1px solid #a9b9b6;border-radius:8px;background:white;color:inherit}.card{background:#fff;border:1px solid #cbd6d0;border-radius:16px;margin-top:18px;padding:26px 22px;text-align:center;box-shadow:0 5px 20px #153b2b08}.badge{display:inline-block;background:#edf3ed;color:#41634a;border-radius:5px;font-size:12px;padding:3px 9px}.drink{font-size:32px;font-weight:700;line-height:1.4;margin:18px 0 8px}.details{font-size:13px;color:#536968}.date{border-top:1px solid #e3e8e1;border-bottom:1px solid #e3e8e1;padding:13px 0;margin:22px 0}.date strong{display:block;font-size:18px}.status{font-size:22px;font-weight:700;color:#285f4d;margin:18px 0 5px}.used{background:#eff6f0;border-color:#9cb6a2}button{font:inherit;font-weight:600;cursor:pointer;border-radius:9px;border:1px solid #aabdb5;padding:13px 16px;background:white;color:#2d5149;width:100%}button.primary{background:#245b4c;color:white;border-color:#245b4c}button:disabled{opacity:.5;cursor:default}.hint{font-size:12px;color:#586b64;margin:13px 0 0}#message{margin-top:16px;background:#fce8e5;color:#7b3028;border-radius:8px;padding:12px;white-space:pre-wrap}#reload{margin-top:18px}dialog{border:1px solid #b6c8bc;border-radius:15px;width:calc(100% - 40px);max-width:410px;padding:24px;color:#203c42}dialog::backdrop{background:#152f2abb}dialog h2{font-size:20px;margin-top:0}dialog button{margin-top:10px}.small{font-size:12px;color:#5c6d65}.testextra{margin-top:22px}a{color:#285e50}button:focus-visible,select:focus-visible{outline:3px solid #b8995d;outline-offset:3px}[hidden]{display:none!important}

/* Compact phone layout: keep conditions and the use button together. */
main{max-width:440px;padding:12px 14px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 10px;text-align:left}header p{font-size:11px;letter-spacing:0}h1{display:none}h2{display:none}.notice{padding:6px 9px;font-size:11px;border-radius:6px}label{font-size:11px;margin:8px 0 4px}select{font-size:12px;padding:7px 8px}.card{margin-top:9px;padding:12px 14px;border-radius:12px}.badge{font-size:11px;padding:2px 6px}.drink{font-size:27px;line-height:1.18;margin:10px 0 7px}.details{font-size:12px;line-height:1.5;margin:8px 0}.date{padding:7px 0;margin:10px 0;font-size:11px}.date strong{font-size:14px;white-space:nowrap}.small{font-size:10px;line-height:1.5}.status{font-size:18px;margin:8px 0 4px}#usedAt{margin:3px 0 7px}button{padding:9px 12px;font-size:14px}.hint{font-size:11px;margin-top:7px;line-height:1.5}#reload{width:auto;flex-shrink:0;padding:5px 9px;margin:0;font-size:12px;border-radius:6px}#message{margin-top:8px;padding:8px;font-size:12px}main>p.small{margin:9px 0 0}
@media(max-width:350px){main{padding:9px 10px}.card{padding:10px}.drink{font-size:24px}.date strong{font-size:13px}header p{font-size:10px}}

/* Keep the completed coupon compact too, without a duplicate disabled button. */
.drink{font-size:clamp(21px,6.2vw,26px);line-height:1.25;white-space:nowrap;margin:9px 0 7px}.used #use{display:none}.used .hint{margin-top:4px}main{padding-top:9px}header{padding-bottom:7px}.card{padding-top:10px;padding-bottom:10px}#usedAt{margin-bottom:4px}
.banner{display:block;width:100%;height:auto;border-radius:8px;margin:0 0 8px}.used .banner{display:none}
</style></head><body><main><header><p>旬魚・お番菜 はまじ 安城本店</p><h1>クーポン</h1><button id="reload" disabled aria-label="クーポンの状態を再読み込み">↻ リロード</button></header><div id="message" role="status" aria-live="polite" hidden></div><label for="choose">クーポンを選択</label><select id="choose" disabled><option>読み込み中…</option></select><section id="card" class="card" hidden><img class="banner" src="coupon-banner.png" alt="はまじ ご来店クーポン" width="1040" height="260" onerror="this.hidden=true"><span id="cohort" class="badge"></span><h2 id="title"></h2><div class="drink">ドリンク1杯サービス</div><p class="details">生ビール・チューハイ・角ハイボール<br>からお選びください。</p><div class="date"><span>ご利用期間</span><strong id="dates"></strong><span class="small">日本時間・最終日は23:59まで</span></div><p class="details">登録者ご本人1回限り。<br>お連れ様も各自のクーポンを使えます。</p><div id="status" class="status"></div><p id="usedAt" class="small"></p><button id="use" class="primary" disabled>クーポンを使う</button><p id="hint" class="hint">ご注文の際にスタッフへお見せください。</p></section><p class="small">通信エラー時はリロードボタンを押して確認してください。</p></main><dialog id="confirm"><h2>使用済みにしますか？</h2><p>スタッフにこの画面を見せてから押してください。</p><p class="small">確定すると、このクーポンは再利用できません。</p><button id="confirmUse" class="primary">使用済みにする</button><button id="cancel">戻る</button></dialog>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
'use strict';
const CONFIG={liffId:'1656084208-LaHUwQs4',apiUrl:'https://script.google.com/macros/s/AKfycbw2Qy3g4dR_NfCV1dCYgK22zMJBFbdFH840aDZ7uv36G1Ep5X-S228Xt56ZSs3g6aSyDA/exec'};
let data=null,busy=false;const $=id=>document.getElementById(id);
function message(text){$('message').textContent=text;$('message').hidden=!text;}
function selected(){return data?.coupons.find(q=>q.id===$('choose').value);}
function render(){const q=selected();$('card').hidden=!q;$('choose').disabled=busy||!data;$('reload').disabled=busy||!data;if(!q)return;$('cohort').textContent=q.cohort==='existing'?'既存のお客様向け・11月限定':q.cohort==='new'?'店頭新規登録・来店特典':'利用条件のテスト';$('title').textContent=q.title;$('dates').textContent=q.usableFrom.replaceAll('-','/')+' 〜 '+q.expiresAt.replaceAll('-','/');$('status').textContent=q.status;$('usedAt').textContent=q.usedAt?'使用日時：'+q.usedAt:'';$('card').className='card'+(q.usedAt?' used':'');$('use').disabled=busy||q.status!=='利用可能';$('use').textContent=q.usedAt?'使用済み':q.status==='利用開始前'?'発行翌日から利用できます':q.status==='期限切れ'?'有効期限を過ぎています':'クーポンを使う';$('hint').textContent=q.usedAt?'このクーポンの使用を記録しました。':'ご注文の際にスタッフへお見せください。';}
async function request(action,couponId){const idToken=liff.getIDToken();if(!idToken)throw Error('本人確認を完了できません。LINEのリンクから開き直してください。');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),25000);try{const res=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:action,idToken:idToken,couponId:couponId}),credentials:'omit',referrerPolicy:'no-referrer',signal:controller.signal});if(!res.ok)throw Error('通信結果を確認できません。');let result;try{result=await res.json();}catch(_){throw Error('サーバーの応答を読み取れません。接続設定を確認してください。');}if(result.success&&result.testOnly!==false)throw Error('本番用の接続設定を確認してください。');if(!result.success)throw Error(result.error||'操作を完了できません。');return result;}finally{clearTimeout(timer);}}
async function update(action='coupon.load',id){if(busy)return;busy=true;message('');render();try{const next=await request(action,id);const prior=$('choose').value;data=next;$('choose').hidden=data.coupons.length<2;document.querySelector('label[for=choose]').hidden=data.coupons.length<2;$('choose').replaceChildren();data.coupons.forEach(q=>{const o=document.createElement('option');o.value=q.id;o.textContent=q.title;$('choose').append(o);});if(data.coupons.some(q=>q.id===prior))$('choose').value=prior;if(!data.coupons.length)message('現在、ご利用いただけるクーポンはありません。');}catch(e){message(e.name==='AbortError'?'通信結果を確認できません。リロードボタンで使用状況を確認してください。':(e.message||'通信結果を確認できません。リロードボタンで確認してください。'));}finally{busy=false;render();$('reload').disabled=false;}}
$('choose').onchange=render;$('reload').onclick=()=>update();$('use').onclick=()=>{if(!busy&&selected()?.status==='利用可能')$('confirm').showModal();};$('cancel').onclick=()=>$('confirm').close();$('confirmUse').onclick=()=>{const q=selected();$('confirm').close();if(q)update('coupon.use',q.id);};
async function start(){try{if(!window.liff)throw Error('LINEの読み込みに失敗しました。開き直してください。');await liff.init({liffId:CONFIG.liffId});if(!liff.isLoggedIn()){liff.login({redirectUri:location.origin+location.pathname});return;}await update();}catch(e){message(e.message||'本人確認を完了できません。');}}
start();
</script></body></html>
